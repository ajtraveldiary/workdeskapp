<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#e06666" />
    <!-- Opens full-screen like an app when added to the iPhone/Android home screen. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="WorkDesk" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23e06666'/><path d='M8 16.5l5 5 11-11' stroke='white' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>WorkDesk</title>
    <!-- Start-up splash (user request 2026-10-06): shows at once, before the app's code arrives; React replaces it.
         App.tsx shows the same splash (Splash in components/ui.tsx) while it checks the sign-in. -->
    <style>
      .wd-splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; background: #fcfcfd; }
      .wd-splash-logo { display: flex; width: 72px; height: 72px; border-radius: 18px; background: #e06666; box-shadow: 0 8px 24px rgb(224 102 102 / 0.3); }
      .wd-splash-logo svg { margin: auto; width: 44px; height: 44px; fill: none; stroke: #fff; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
      .wd-splash-spin { width: 24px; height: 24px; border-radius: 50%; border: 3px solid rgb(224 102 102 / 0.2); border-top-color: #e06666; animation: wd-spin 0.8s linear infinite; }
      @keyframes wd-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .wd-splash-spin { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="wd-splash" role="status" aria-label="Loading WorkDesk">
        <span class="wd-splash-logo"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M8 16.5l5 5 11-11" /></svg></span>
        <span class="wd-splash-spin" aria-hidden="true"></span>
      </div>
    </div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
